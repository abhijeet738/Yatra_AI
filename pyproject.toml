[project]
name = "yatra-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiolimiter>=1.3",
    "aiosqlite>=0.22",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "redis>=5.2",
    "structlog>=25.1",
    "tenacity>=9.0",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pre-commit>=4.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
